name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Comprobaciones (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      # Also produces ui/dist, which the Tauri crate embeds at compile time.
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npm test
      # Uses the Microsoft Edge preinstalled on the runner; the IPC is simulated.
      - run: npx playwright test --trace off
      # Proves the optimised executable links, and keeps it downloadable from the run.
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: proyecto-reze-${{ github.sha }}
          path: target/release/proyecto-reze.exe
          if-no-files-found: error
          retention-days: 14
